version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dev:
    desc: Run the API locally with Air hot reload
    cmds:
      - go run github.com/air-verse/air@v1.61.7 -c .air.toml

  build:
    desc: Build the API binary
    cmds:
      - go build -o ./tmp/wilayah-indonesia-api ./api

  run:
    desc: Run the API locally
    cmds:
      - go run ./api

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  quality:
    desc: Run formatting, tests, vet, and build checks
    cmds:
      - test -z "$(gofmt -l ./api ./internal ./modules)" || (echo "Go files are not formatted:" && gofmt -l ./api ./internal ./modules && exit 1)
      - go test ./...
      - go vet ./...
      - go build ./...

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w ./api ./internal ./modules

  swagger:
    desc: Generate Swagger documentation from Go annotations
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g index.go -d ./api,./modules/province,./modules/regency,./modules/district,./modules/subdistrict,./internal/httpx,./internal/config,./internal/database,./internal/env -o ./docs --outputTypes go,json,yaml --parseDependency --parseInternal

  docker:up:
    desc: Build and run the development container
    cmds:
      - docker compose up --build

  docker:down:
    desc: Stop the development container
    cmds:
      - docker compose down

  docker:build:
    desc: Build the production image
    cmds:
      - docker build --target production -t wilayah-indonesia-api:latest .
